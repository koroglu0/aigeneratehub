version: '3.8'

services:
  prompt-builder:
    build: ./services/prompt-builder
    ports:
      - "3001:3001"
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./services/prompt-builder/src:/app/src
    command: ["npx", "nodemon", "src/index.js"]

  ai-integration:
    build: ./services/ai-integration
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      PORT: "3002"
    depends_on:
      - prompt-builder
    restart: unless-stopped
    volumes:
      - ./services/ai-integration/src:/app/src
    command: ["npx", "nodemon", "src/index.js"]

  user-service:
    build: ./services/user-service
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      PORT: "3003"
    restart: unless-stopped
    volumes:
      - ./services/user-service/src:/app/src
    command: ["npx", "nodemon", "src/index.js"]

  local-proxy:
    build:
      context: ./infrastructure
      dockerfile: Dockerfile.proxy
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - prompt-builder
      - ai-integration
      - user-service
