version: '3.8'

services:
  prompt-builder:
    build: ./services/prompt-builder
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: "3001"
    restart: unless-stopped

  ai-integration:
    build: ./services/ai-integration
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      PORT: "3002"
      PROMPT_BUILDER_URL: "http://prompt-builder:3001"
    depends_on:
      - prompt-builder
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      PORT: "3003"
    restart: unless-stopped
